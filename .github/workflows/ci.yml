name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        include:
          # macOS Intel (x64) como segunda via: os runners macOS arm64 muitas vezes nao sao adquiridos (capacidade).
          - { os: macos-15-intel, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm test
  # Testes ponta a ponta com Claude Code/OpenCode reais (servidor falso, sem custo) so em Linux e macOS: os scripts sao bash.
  e2e:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, macos-15-intel] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run e2e:claude-plugin
      - run: npm run e2e:claude-plugin-failure
      - run: npm run e2e:opencode
  # E2E nativo em Node (sem bash): roda tambem no Windows. Clientes reais, servidores falsos, sem gasto.
  e2e-native:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run e2e:native
  # PACOTE INSTALADO: empacota (npm pack), instala em diretorio limpo com as dependencias do npm e roda o E2E nativo
  # a partir do pacote instalado (nao do checkout). Clientes reais, servidores falsos, sem gasto.
  e2e-packaged:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm pack --silent
          mkdir "$RUNNER_TEMP/inst" && cd "$RUNNER_TEMP/inst"
          npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/opencode-precost-*.tgz
          test -d node_modules/@opencode-ai/plugin
          cp -r "$GITHUB_WORKSPACE/scripts" node_modules/opencode-precost/scripts
          cd node_modules/opencode-precost
          node scripts/e2e-native.mjs
